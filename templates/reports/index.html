{% extends "base.html" %}

{% block title %}Отчёты - Ansible Control Panel{% endblock %}

{% block breadcrumbs %}
    <li class="breadcrumb-item active">Отчёты и аналитика</li>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card shadow mb-4">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>Аналитика системы</h5>
                </div>
                <div class="card-body text-center">
                    <h3 class="text-muted">Раздел в разработке</h3>
                    <p class="lead">Здесь будут графики и отчёты о работе системы</p>
                    <i class="bi bi-bar-chart display-1 text-secondary"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

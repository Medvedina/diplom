{% extends "base.html" %}

{% block title %}Запуск {{ playbook_name }} - Ansible Control Panel{% endblock %}

{% block breadcrumbs %}
    <li class="breadcrumb-item">
        <a href="{{ url_for('playbooks.pb_list') }}">Плейбуки</a>
    </li>
    <li class="breadcrumb-item active">Запуск</li>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0">
                <i class="bi bi-play-circle me-2"></i>Запуск плейбука: {{ playbook_name }}
            </h5>
        </div>
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="inventorySelect" class="form-label">Выберите инвентарь</label>
                    <select class="form-select" id="inventorySelect">
                        <option value="">-- Выберите инвентарь --</option>
                        {% for inv in inventories %}
                        <option value="{{ inv }}">{{ inv }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-end">
                    <button class="btn btn-primary me-2" onclick="runPlaybook()">
                        <i class="bi bi-play-fill me-1"></i>Запустить
                    </button>
                    <button class="btn btn-outline-secondary" onclick="showPreview()">
                        <i class="bi bi-eye me-1"></i>Предпросмотр
                    </button>
                </div>
            </div>

            <div id="executionOutput" style="display: none;">
                <h6 class="mb-3">Результат выполнения:</h6>
                <div class="execution-output p-3 bg-dark text-light rounded" style="font-family: monospace; max-height: 400px; overflow-y: auto;">
                    <div id="outputContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function runPlaybook() {
    const inventory = document.getElementById('inventorySelect').value;
    
    if (!inventory) {
        alert('Выберите инвентарь');
        return;
    }
    
    const outputDiv = document.getElementById('executionOutput');
    const outputContent = document.getElementById('outputContent');
    
    outputDiv.style.display = 'block';
    outputContent.innerHTML = '<i class="bi bi-hourglass-split"></i> Запуск плейбука...';
    
    fetch('/playbooks/api/run-playbook', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            playbook: '{{ playbook_name }}',
            inventory: inventory
        })
    })
    .then(response => response.json())
    .then(data => {
        let html = '<div class="mb-3">';
        html += `<span class="text-success">✓ Playbook execution completed</span><br>`;
        html += `Target: ${inventory}<br>`;
        html += `Timestamp: ${new Date(data.timestamp * 1000).toLocaleString()}<br>`;
        html += '</div>';
        
        if (data.results) {
            html += '<table class="table table-dark table-sm">';
            html += '<tr><th>Host</th><th>Status</th><th>Changed</th><th>Output</th></tr>';
            
            data.results.forEach(r => {
                html += `<tr>`;
                html += `<td>${r.host}</td>`;
                html += `<td><span class="badge ${r.success ? 'bg-success' : 'bg-danger'}">${r.success ? 'OK' : 'FAILED'}</span></td>`;
                html += `<td>${r.changed ? '✓' : '✗'}</td>`;
                html += `<td>${r.output}</td>`;
                html += `</tr>`;
            });
            
            html += '</table>';
            
            if (data.summary) {
                html += `<div class="mt-3">
                    <span class="badge bg-success">OK: ${data.summary.ok}</span>
                    <span class="badge bg-danger">Failed: ${data.summary.failed}</span>
                    <span class="badge bg-warning">Changed: ${data.summary.changed}</span>
                </div>`;
            }
        }
        
        outputContent.innerHTML = html;
    });
}

function showPreview() {
    // Заглушка для предпросмотра
    alert('Функция предпросмотра будет добавлена позже');
}
</script>
{% endblock %}

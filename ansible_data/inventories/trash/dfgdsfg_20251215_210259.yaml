all:
  vars:
    ansible_network_os: ios
    ansible_connection: network_cli
    ansible_user: admin
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_become: 'yes'
    ansible_become_method: enable
  children:
    routers:
      hosts: {}
      vars:
        device_type: router
        description: Маршрутизаторы
    switches:
      hosts: {}
      vars:
        device_type: switch
        description: Коммутаторы
